<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Subi</title>
    <link rel="stylesheet" href="./seller-market/styles.css" />
    <style>
      body {
        min-height: 100vh;
        overflow: hidden;
      }

      .entry-shell {
        position: relative;
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 32px;
        overflow: hidden;
      }

      .entry-content {
        position: relative;
        z-index: 2;
        width: min(760px, 100%);
        text-align: center;
      }

      .entry-brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 28px;
        color: var(--muted);
        font-size: 14px;
        font-weight: 700;
      }

      .entry-content h1 {
        margin: 0;
        color: var(--text);
        font-size: clamp(42px, 7vw, 82px);
        font-weight: 430;
        line-height: 1.02;
        letter-spacing: 0;
      }

      .entry-content p {
        max-width: 640px;
        margin: 26px auto 0;
        color: var(--muted);
        font-size: clamp(18px, 2.3vw, 24px);
        font-weight: 560;
        line-height: 1.55;
      }

      .entry-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 14px;
        margin-top: 38px;
      }

      .entry-actions a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 168px;
        min-height: 58px;
        padding: 0 26px;
        border-radius: 8px;
        font-size: 18px;
        font-weight: 760;
      }

      .entry-actions .primary-action {
        box-shadow: 0 16px 38px rgba(44, 44, 44, 0.16);
      }

      .entry-note {
        display: inline-flex;
        margin-top: 54px;
        padding: 10px 18px;
        color: var(--faint);
        background: rgba(255, 255, 255, 0.58);
        border: 1px solid rgba(255, 255, 255, 0.78);
        border-radius: 999px;
        font-size: 13px;
        font-weight: 650;
        box-shadow: 0 10px 34px rgba(44, 44, 44, 0.06);
        backdrop-filter: blur(16px);
      }

      @media (max-width: 720px) {
        body {
          overflow: auto;
        }

        .entry-shell {
          min-height: 100svh;
          padding: 24px;
        }

        .entry-content {
          text-align: left;
        }

        .entry-content p {
          margin-left: 0;
        }

        .entry-actions {
          justify-content: stretch;
        }

        .entry-actions a {
          width: 100%;
        }
      }
    </style>
  </head>
  <body data-entry-only="true">
    <main class="entry-shell">
      <canvas class="network-map" id="network-map" aria-hidden="true"></canvas>
      <div class="hero-overlay" aria-hidden="true"></div>
      <section class="entry-content" aria-labelledby="entry-title">
        <div class="entry-brand">
          <span class="brand-mark" aria-hidden="true">S</span>
          <span>分布式 TOKEN 共享平台</span>
        </div>
        <h1 id="entry-title">你想用 Subi<br />做什么？</h1>
        <p>用闲置订阅赚收益，或用同一个 Subi Key 接入顶级编程模型。</p>
        <div class="entry-actions">
          <a class="primary-action" href="/seller/">让闲置订阅赚钱</a>
          <a class="secondary-action" href="/buyer/">使用顶级编程模型</a>
        </div>
        <div class="entry-note">选择后进入对应控制台</div>
      </section>
    </main>
    <script src="./seller-market/app.js"></script>
  </body>
</html>
